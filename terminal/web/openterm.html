<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<title>OPEN TERMINAL</title>
<!-- Layout: fixed Bloomberg-style grid — top command/P&L bar, left ticker rail, main module canvas, bottom news ticker + status/command line. Single deliberately-dark terminal look. -->
<style>
:root{
  color-scheme: dark;
  /* palette */
  --bg:#06080c; --panel:#0b0f16; --panel2:#0e1420; --line:#1c2432; --line2:#2a3545;
  --fg:#d6e0ee; --dim:#7d8ba0; --faint:#4b5668;
  --amber:#f7a700; --amber2:#ffca55;
  --up:#1fbf75; --down:#ff4d5e; --cyan:#35c3e0; --mag:#d957d9; --blue:#3b6fe0; --violet:#9a7bff;
  /* type */
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:12px;line-height:1.3;overflow:hidden;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-rows:auto auto 1fr auto auto;height:100%;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
/* ---- top bar ---- */
.top{display:flex;align-items:center;gap:0;background:linear-gradient(180deg,#0c111a,#080b12);border-bottom:1px solid var(--line2);height:30px;padding:0 8px}
.brand{font-family:var(--sans);font-weight:800;letter-spacing:.32em;color:var(--amber);font-size:12px;padding-right:12px;white-space:nowrap}
.brand b{color:var(--fg);font-weight:300}
.menu{display:flex;gap:1px;overflow:hidden;flex:1;min-width:0}
.menu button{background:transparent;border:0;color:var(--dim);font-family:var(--mono);font-size:11px;padding:4px 7px;cursor:pointer;letter-spacing:.04em;border-radius:2px}
.menu button:hover{color:var(--fg);background:#131a26}
.menu button.on{color:#06080c;background:var(--amber);font-weight:700}
.tstat{display:flex;gap:14px;align-items:center;white-space:nowrap;padding-left:10px}
.tstat .k{color:var(--faint);font-size:10px}
.tstat .v{font-variant-numeric:tabular-nums}
.pl-pos{color:var(--up)} .pl-neg{color:var(--down)}
/* ---- subbar (module tabs within a function) ---- */
.subbar{display:flex;align-items:center;gap:2px;height:22px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto;white-space:nowrap}
.subbar .seg{color:var(--faint);font-size:10px;padding:2px 8px;cursor:pointer;letter-spacing:.06em}
.subbar .seg.on{color:var(--amber);border-bottom:2px solid var(--amber)}
.subbar .spacer{flex:1}
.subbar .meta{color:var(--dim);font-size:10px}
/* ---- body ---- */
.body{display:grid;grid-template-columns:186px 1fr;min-height:0;overflow:hidden}
.rail{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.rail .cat{color:var(--amber);font-size:9.5px;letter-spacing:.14em;padding:5px 8px 3px;border-top:1px solid var(--line);position:sticky}
.row{display:grid;grid-template-columns:1fr auto 46px;gap:6px;align-items:center;padding:2px 8px;cursor:pointer;border-left:2px solid transparent}
.row:hover{background:#121a28}
.row.sel{background:#14202f;border-left-color:var(--amber)}
.row .sym{color:var(--fg);font-size:11px}
.row .px{font-variant-numeric:tabular-nums;font-size:11px;text-align:right}
.row .spk{height:14px}
.main{position:relative;min-width:0;overflow:hidden;background:var(--bg)}
.mod{position:absolute;inset:0;display:none;overflow:hidden}
.mod.on{display:block}
.pad{padding:8px;height:100%;overflow:auto}
canvas{display:block}
/* ---- bottom ---- */
.news{height:22px;background:#0a0e15;border-top:1px solid var(--line);display:flex;align-items:center;overflow:hidden;font-size:11px}
.news .tag{background:var(--down);color:#fff;font-weight:700;padding:0 8px;height:100%;display:flex;align-items:center;font-size:10px;letter-spacing:.08em}
.news .track{white-space:nowrap;will-change:transform;padding-left:100%;color:var(--dim)}
.news .track b{color:var(--fg)} .news .track .u{color:var(--up)} .news .track .d{color:var(--down)}
.status{height:26px;background:linear-gradient(180deg,#0c111a,#070a10);border-top:1px solid var(--line2);display:flex;align-items:center;gap:8px;padding:0 8px}
.status .fkey{color:var(--faint);font-size:10px}
.status .fkey b{color:var(--amber);font-weight:700}
.cmd{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.cmd .prompt{color:var(--amber);font-weight:700}
.cmd input{flex:1;min-width:0;background:#05070b;border:1px solid var(--line2);color:var(--fg);font-family:var(--mono);font-size:12px;padding:3px 8px;letter-spacing:.14em;text-transform:uppercase;outline:none}
.cmd input:focus{border-color:var(--amber)}
.go{background:var(--up);color:#06080c;font-weight:700;border:0;padding:4px 12px;cursor:pointer;letter-spacing:.1em}
.right{color:var(--faint);font-size:10px;white-space:nowrap}
/* ---- generic tables ---- */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{color:var(--faint);font-weight:500;text-align:right;padding:3px 8px;font-size:10px;letter-spacing:.04em;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel2)}
th.l,td.l{text-align:left}
td{padding:2px 8px;border-bottom:1px solid #121824;font-size:11px}
tr:hover td{background:#101826}
.u{color:var(--up)} .d{color:var(--down)} .am{color:var(--amber)} .cy{color:var(--cyan)} .dim{color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;height:100%;background:var(--line)}
.grid2>div{background:var(--bg);min-width:0;overflow:hidden;position:relative}
.hd{color:var(--amber);font-size:10px;letter-spacing:.12em;padding:5px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
.tkt label{display:block;color:var(--faint);font-size:10px;margin:6px 0 2px;letter-spacing:.06em}
.tkt input,.tkt select{width:100%;background:#05070b;border:1px solid var(--line2);color:var(--fg);font-family:var(--mono);padding:4px 6px;font-size:12px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.bbuy{background:var(--up);color:#041008;border:0;padding:8px;font-weight:700;cursor:pointer;letter-spacing:.08em}
.bsell{background:var(--down);color:#1a0406;border:0;padding:8px;font-weight:700;cursor:pointer;letter-spacing:.08em}
.pos{font-size:11px}
.badge{display:inline-block;padding:0 5px;border:1px solid var(--line2);border-radius:2px;color:var(--dim);font-size:9.5px;letter-spacing:.06em}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#1e2838;border-radius:4px}::-webkit-scrollbar-track{background:#0a0e15}
.hint{color:var(--faint);font-size:10px;padding:6px 8px}
a{color:var(--cyan)}
@media (max-width:620px){ .body{grid-template-columns:120px 1fr} .brand{letter-spacing:.12em} }
</style>

<div class="app">
  <!-- TOP BAR -->
  <div class="top">
    <div class="brand">OPEN<b>TERM</b></div>
    <div class="menu" id="menu"></div>
    <div class="tstat">
      <div><span class="k">P/L </span><span class="v" id="hPL">+0</span></div>
      <div><span class="k">FLOATY </span><span class="v" id="hFloat">0</span></div>
      <div><span class="k">VOL </span><span class="v" id="hVol">0%</span></div>
      <div><span class="k"></span><span class="v" id="hClock">--:--:--</span></div>
    </div>
  </div>

  <!-- SUBBAR -->
  <div class="subbar" id="subbar"></div>

  <!-- BODY -->
  <div class="body">
    <div class="rail" id="rail"></div>
    <div class="main" id="main"></div>
  </div>

  <!-- NEWS TICKER -->
  <div class="news"><div class="tag" id="newsTag">BREAKING</div><div class="track" id="newsTrack"></div></div>

  <!-- STATUS / COMMAND -->
  <div class="status">
    <span class="fkey"><b>⏎</b> RUN</span>
    <div class="cmd">
      <span class="prompt">&gt;</span>
      <input id="cmd" autocomplete="off" spellcheck="false" placeholder="TYPE A FUNCTION (MON, CHRT, WX, OPTS, VOLS, GEX, SHIP…) THEN ENTER" />
      <button class="go" id="goBtn">GO</button>
    </div>
    <span class="right" id="simMode">SIM · synthetic market · open-data backend in /terminal</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js"></script>
<script>
/* ============================================================================
   OPEN TERMINAL — a self-contained Bloomberg-style terminal simulation.
   All data here is synthetic (an in-page market engine); the companion Python
   backend in /terminal wires the same UI to real open data (London Strategic
   Edge, Deribit, Binance, Kenneth French, FRED, NOAA/NHC, AISStream, NASA GIBS).
   ============================================================================ */
"use strict";
const $=s=>document.querySelector(s), el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const fmt=(n,d=2)=>n==null?'—':n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=n=>(n>=0?'+':'')+fmt(n);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
let RNG=1234567; const rnd=()=>{RNG=(RNG*1103515245+12345)&0x7fffffff;return RNG/0x7fffffff;};
const gauss=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};

/* ---------------- market universe ---------------- */
const UNIV=[
 ['CMDTY',[['CL','Crude WTI',72.1,.028],['NG','Nat Gas',2.84,.045],['GC','Gold',2650,.012],['HG','Copper',4.12,.02],['RB','Gasoline',2.05,.03]]],
 ['FX',[['EURUSD','Euro',1.084,.006],['USDJPY','Yen',157.3,.007],['GBPUSD','Sterling',1.272,.006],['AUDUSD','Aussie',.651,.008]]],
 ['GOVT',[['US10Y','UST 10Y',4.28,.015],['US2Y','UST 2Y',4.61,.014],['DE10Y','Bund 10Y',2.36,.016]]],
 ['INDX',[['SPX','S&P 500',5860,.009],['NDX','Nasdaq 100',20950,.012],['VIX','Volatility',14.2,.09],['RUT','Russell',2310,.013]]],
 ['EQTY',[['AAPL','Apple',228.5,.016],['NVDA','Nvidia',138.2,.03],['TSLA','Tesla',352.4,.035],['XOM','Exxon',118.6,.018]]],
 ['CRYPTO',[['BTC','Bitcoin',97250,.03],['ETH','Ether',3420,.038],['SOL','Solana',221,.05]]],
];
const INST={}; const ORDER=[];
for(const [cat,list] of UNIV)for(const [sym,name,px,vol] of list){
  INST[sym]={sym,name,cat,px,px0:px,vol,bid:px,ask:px,hist:[],cndl:[],oi:{}};
  ORDER.push(sym);
}
let SEL='CL';                     // selected instrument
let T=0;                          // sim tick
const DAY0=Date.UTC(2026,10,11,13,30,0)/1000;

/* seed history + candles */
function seed(){
  for(const s of ORDER){
    const I=INST[s]; let p=I.px0; const h=[];
    for(let i=0;i<260;i++){ p*=Math.exp((gauss()*I.vol/16)-(I.vol*I.vol/512)); h.push(p); }
    I.hist=h; I.px=p; I.px0=h[0];
    // daily candles
    let cp=h[0], C=[];
    for(let d=0;d<180;d++){
      const o=cp; let hi=o,lo=o,c=o;
      for(let k=0;k<6;k++){c*=Math.exp(gauss()*I.vol/22);hi=Math.max(hi,c);lo=Math.min(lo,c);}
      C.push({time:DAY0-(180-d)*86400,open:o,high:hi,low:lo,close:c,vol:Math.abs(gauss())*1e4+4e3});
      cp=c;
    }
    I.cndl=C; I.px=cp; I.bid=cp*(1-2e-4); I.ask=cp*(1+2e-4);
  }
}
seed();

/* ---------------- hurricane / oil scenario (the WX narrative) ---------------- */
const STORM={name:'HURRICANE KESTREL',cat:1,lat:14,lon:-74,hdg:305,spd:.55,landfall:false,t:0,
  track:[]};
function stepStorm(){
  STORM.t++;
  // move NW toward Gulf oil ports
  STORM.lon-=Math.cos((90-STORM.hdg)*Math.PI/180)*STORM.spd*-1;
  STORM.lat+=Math.sin((90-STORM.hdg)*Math.PI/180)*STORM.spd*0 + STORM.spd*0.55;
  STORM.lon-=STORM.spd*0.8;
  STORM.cat=clamp(1+Math.floor(STORM.t/55),1,5);
  STORM.track.push([STORM.lon,STORM.lat]);
  if(STORM.track.length>120)STORM.track.shift();
  // approaching Gulf (lon ~ -94, lat ~ 29) ramps crude
  const dist=Math.hypot(STORM.lon+94,STORM.lat-29);
  const press=clamp((9-dist)/9,0,1);
  INST.CL.scen=press*0.45*(STORM.cat/5);      // up to +45% pressure on crude
  INST.RB.scen=press*0.5*(STORM.cat/5);
  INST.XOM.scen=press*0.18;
  if(dist<1.4&&!STORM.landfall){STORM.landfall=true; pushNews('LANDFALL — GULF COAST OIL PORT SHUT, LOOP TERMINAL HALTS LOADINGS','d');}
}

/* ---------------- tick loop ---------------- */
let positions=[];   // {sym,qty,entry}
let realized=0;
function step(){
  T++;
  stepStorm();
  for(const s of ORDER){
    const I=INST[s];
    const scen=I.scen||0;
    const drift=scen*0.004;
    if(window.LIVE&&LIVE.on&&LIVE.px[s]!=null){ I.px=LIVE.px[s]; }   // live feed overrides the sim
    else { I.px*=Math.exp(gauss()*I.vol/44 + drift); }
    I.bid=I.px*(1-(2+rnd()*3)*1e-4); I.ask=I.px*(1+(2+rnd()*3)*1e-4);
    I.hist.push(I.px); if(I.hist.length>260)I.hist.shift();
    // extend intraday candle (last)
    const C=I.cndl[I.cndl.length-1];
    if(T%6===0){ I.cndl.push({time:C.time+86400,open:C.close,high:I.px,low:I.px,close:I.px,vol:0}); if(I.cndl.length>400)I.cndl.shift(); }
    else { C.high=Math.max(C.high,I.px); C.low=Math.min(C.low,I.px); C.close=I.px; C.vol+=Math.abs(gauss())*800; }
  }
  updateHeader(); renderRail();
  const m=MODREG[curMod]; if(m&&m.tick)m.tick();
}

/* ---------------- header ---------------- */
function unreal(){let u=0;for(const p of positions){const I=INST[p.sym];u+=(I.px-p.entry)*p.qty*mult(p.sym);}return u;}
function mult(s){return INST[s].cat==='CRYPTO'?1:(INST[s].cat==='CMDTY'?1000:100);}
function updateHeader(){
  const u=unreal(), pl=realized+u;
  const e=$('#hPL'); e.textContent=sgn(pl); e.className='v '+(pl>=0?'pl-pos':'pl-neg');
  $('#hFloat').textContent=sgn(u);
  $('#hVol').textContent=fmt(INST.VIX.px,1)+'%';
  const secs=DAY0+T*5;
  $('#hClock').textContent=new Date(secs*1000).toUTCString().slice(17,25)+'Z';
}

/* ---------------- ticker rail ---------------- */
function spark(hist,w=42,h=14,col){
  const c=el('canvas','spk');c.width=w*2;c.height=h*2;c.style.width=w+'px';c.style.height=h+'px';
  const x=c.getContext('2d');const H=hist.slice(-30);const mn=Math.min(...H),mx=Math.max(...H),r=mx-mn||1;
  x.strokeStyle=col;x.lineWidth=2;x.beginPath();
  H.forEach((v,i)=>{const px=i/(H.length-1)*c.width,py=c.height-((v-mn)/r)*c.height;i?x.lineTo(px,py):x.moveTo(px,py);});
  x.stroke();return c;
}
let railBuilt=false;
function buildRail(){
  const rail=$('#rail');rail.innerHTML='';
  for(const [cat,list] of UNIV){
    const c=el('div','cat');c.textContent=cat;rail.appendChild(c);
    for(const [sym] of list){
      const I=INST[sym];const row=el('div','row');row.dataset.sym=sym;
      row.innerHTML=`<span class="sym">${sym}</span><span class="px" data-px></span>`;
      const sp=el('span');sp.dataset.spk='';row.appendChild(sp);
      row.onclick=()=>{SEL=sym;renderRail();const m=MODREG[curMod];if(m&&m.sel)m.sel();};
      rail.appendChild(row);
    }
  }
  railBuilt=true;
}
let railThrottle=0;
function renderRail(){
  if(!railBuilt)buildRail();
  for(const row of $('#rail').querySelectorAll('.row')){
    const I=INST[row.dataset.sym];const chg=(I.px/I.px0-1)*100;
    row.classList.toggle('sel',row.dataset.sym===SEL);
    const px=row.querySelector('[data-px]');px.textContent=fmt(I.px,I.px<10?4:2);
    px.className='px '+(chg>=0?'u':'d');
  }
  if(T-railThrottle>=4||railThrottle===0){  // sparks less often
    railThrottle=T;
    for(const row of $('#rail').querySelectorAll('.row')){
      const I=INST[row.dataset.sym];const chg=(I.px/I.px0-1)*100;
      const holder=row.querySelector('[data-spk]');holder.innerHTML='';
      holder.appendChild(spark(I.hist,42,14,chg>=0?getCss('--up'):getCss('--down')));
    }
  }
}
const getCss=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------------- Black-Scholes (options modules) ---------------- */
function normcdf(x){const t=1/(1+.2316419*Math.abs(x));const d=.3989423*Math.exp(-x*x/2);
  let p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p;}
function bs(S,K,T,r,sig,call){
  if(T<=0)return{px:Math.max(0,call?S-K:K-S),d:call?1:-1,g:0,v:0,th:0};
  const d1=(Math.log(S/K)+(r+sig*sig/2)*T)/(sig*Math.sqrt(T)),d2=d1-sig*Math.sqrt(T);
  const nd1=normcdf(d1),nd2=normcdf(d2),pdf=.3989423*Math.exp(-d1*d1/2);
  const px=call?S*nd1-K*Math.exp(-r*T)*nd2:K*Math.exp(-r*T)*normcdf(-d2)-S*normcdf(-d1);
  return{px,d:call?nd1:nd1-1,g:pdf/(S*sig*Math.sqrt(T)),v:S*pdf*Math.sqrt(T)/100,
    th:(-S*pdf*sig/(2*Math.sqrt(T))-r*K*Math.exp(-r*T)*(call?nd2:1-nd2))/365};
}
function ivSurface(S){
  // smile + term structure
  const exps=[7,14,30,60,90,180].map(d=>d/365);
  const ks=[]; for(let i=-6;i<=6;i++)ks.push(S*(1+i*0.03));
  return {exps,ks,S,
    iv:(k,t)=>{const m=Math.log(k/S);return 0.18+0.9*m*m/(t+.05)-0.15*m+0.03*Math.sqrt(t);}};
}

/* ===========================================================================
   MODULES
   =========================================================================== */
const main=$('#main');
function panel(id){const d=el('div','mod');d.id='mod-'+id;main.appendChild(d);return d;}
let curMod='MON';
const MODREG={};

/* ---- MON : market monitor ---- */
(function(){
 const p=panel('MON');const wrap=el('div','pad');p.appendChild(wrap);
 function render(){
   let h='<table><thead><tr><th class="l">TICKER</th><th class="l">NAME</th><th>LAST</th><th>CHG</th><th>%CHG</th><th>BID</th><th>ASK</th><th>DAY RANGE</th></tr></thead><tbody>';
   for(const s of ORDER){const I=INST[s];const chg=I.px-I.px0,pc=chg/I.px0*100;const d=I.px<10?4:2;
     const lo=Math.min(...I.hist),hi=Math.max(...I.hist),pos=(I.px-lo)/((hi-lo)||1)*100;
     h+=`<tr><td class="l am">${s}</td><td class="l dim">${I.name}</td><td>${fmt(I.px,d)}</td>
     <td class="${chg>=0?'u':'d'}">${sgn(chg)}</td><td class="${pc>=0?'u':'d'}">${sgn(pc)}%</td>
     <td class="dim">${fmt(I.bid,d)}</td><td class="dim">${fmt(I.ask,d)}</td>
     <td><div style="position:relative;height:8px;background:#0e1420;border:1px solid #1c2432">
       <div style="position:absolute;left:${clamp(pos,0,100)}%;top:-1px;width:2px;height:8px;background:var(--amber)"></div></div></td></tr>`;}
   h+='</tbody></table>';wrap.innerHTML=h;
 }
 MODREG.MON={show:render,tick:()=>{if(curMod==='MON'&&T%2===0)render();}};
})();

/* ---- CHRT : candles + MA + volume (lightweight-charts) ---- */
(function(){
 const p=panel('CHRT');p.style.padding='0';let chart,cs,ma,vol,inited=false,lastSel=null;
 function build(){
   p.innerHTML='';chart=LightweightCharts.createChart(p,{
     layout:{background:{color:getCss('--bg')},textColor:getCss('--dim'),fontFamily:'JetBrains Mono,monospace',fontSize:10},
     grid:{vertLines:{color:'#10161f'},horzLines:{color:'#10161f'}},
     rightPriceScale:{borderColor:'#1c2432'},timeScale:{borderColor:'#1c2432',timeVisible:true},
     crosshair:{mode:0},width:p.clientWidth,height:p.clientHeight});
   cs=chart.addCandlestickSeries({upColor:getCss('--up'),downColor:getCss('--down'),borderVisible:false,
     wickUpColor:getCss('--up'),wickDownColor:getCss('--down')});
   ma=chart.addLineSeries({color:getCss('--amber'),lineWidth:1,priceLineVisible:false});
   vol=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'',color:'#2a3545'});
   vol.priceScale().applyOptions({scaleMargins:{top:.82,bottom:0}});
   inited=true;
 }
 function load(){
   const I=INST[SEL];const C=I.cndl;
   cs.setData(C);vol.setData(C.map(c=>({time:c.time,value:c.vol,color:c.close>=c.open?'#17402e':'#3a1620'})));
   const per=20,m=[];for(let i=0;i<C.length;i++){if(i<per-1)continue;let s=0;for(let j=0;j<per;j++)s+=C[i-j].close;m.push({time:C[i].time,value:s/per});}

/* ---- HEAT : resting-liquidity heatmap (bookmap-style, canvas) ---- */
(function(){
 const p=panel('HEAT');const cv=el('canvas');p.appendChild(cv);const x=cv.getContext('2d');
 let cols=[];const NC=180,NR=80;
 function fit(){cv.width=p.clientWidth*devicePixelRatio;cv.height=p.clientHeight*devicePixelRatio;cv.style.width=p.clientWidth+'px';cv.style.height=p.clientHeight+'px';}
 function col(){const I=INST[SEL];const mid=I.px;const band=mid*0.02;const arr=[];
   for(let r=0;r<NR;r++){const d=(r/NR-.5)*2;arr.push(Math.exp(-d*d*6)*(0.4+rnd()*0.6)*(1+(rnd()<.03?4:0)));}
   return{mid,band,arr,px:I.px};}
 function render(){
   fit();const W=cv.width,H=cv.height;x.fillStyle='#06080c';x.fillRect(0,0,W,H);
   if(cols.length<2)return;
   const mn=Math.min(...cols.map(c=>c.mid-c.band)),mx=Math.max(...cols.map(c=>c.mid+c.band));
   const cw=W/NC;
   cols.forEach((c,ci)=>{for(let r=0;r<NR;r++){const v=c.arr[r];const price=c.mid-c.band+(r/NR)*2*c.band;
     const y=H-((price-mn)/((mx-mn)||1))*H;const inten=clamp(v,0,1.4);
     // blue->cyan->yellow->red colormap
     const t=clamp(inten/1.4,0,1);let R,G,B;
     if(t<.5){R=0;G=Math.floor(t*2*180);B=Math.floor(120+t*2*135);}else{R=Math.floor((t-.5)*2*255);G=Math.floor(180+(t-.5)*0);B=Math.floor(255-(t-.5)*2*255);}
     x.fillStyle=`rgb(${R},${G},${B})`;x.globalAlpha=clamp(inten,.05,1);x.fillRect(ci*cw,y,cw+1,H/NR+1);}});
   x.globalAlpha=1;
   // price line
   x.strokeStyle='#ffffff';x.lineWidth=1.5;x.beginPath();
   cols.forEach((c,ci)=>{const y=H-((c.px-mn)/((mx-mn)||1))*H;ci?x.lineTo(ci*cw+cw/2,y):x.moveTo(ci*cw+cw/2,y);});x.stroke();
 }
 MODREG.HEAT={show:()=>{if(cols.length<3){cols=[];for(let i=0;i<NC;i++)cols.push(col());}render();},
   sel:()=>{cols=[];},
   tick:()=>{if(curMod==='HEAT'){cols.push(col());if(cols.length>NC)cols.shift();render();}}};
})();

(function(){
 const p=panel('SHIP');const cv=el('canvas');p.appendChild(cv);const x=cv.getContext('2d');

 function render(){
   cv.width=p.clientWidth*devicePixelRatio;cv.height=p.clientHeight*devicePixelRatio;cv.style.width=p.clientWidth+'px';cv.style.height=p.clientHeight+'px';

   // graticule

   for(let i=1;i<6;i++){x.beginPath();x.moveTo(0,H*i/6);x.lineTo(W,H*i/6);x.stroke();}

   blobs.forEach(b=>{const[cx,cy]=geo(b[0],b[1],W,H);x.beginPath();x.ellipse(cx,cy,b[2]/360*W,b[3]/135*H,0,0,7);x.fill();});

function renderSub(){
 const g=groupOf(curMod);const sb=$('#subbar');sb.innerHTML='';
 if(g){SUB[g].forEach(mod=>{const s=el('span','seg'+(mod===curMod?' on':''));s.textContent=MENU.find(x=>x[0]===mod)?.[1]||mod;s.onclick=()=>go(mod);sb.appendChild(s);});}
 const sp=el('span','spacer');sb.appendChild(sp);
 const meta=el('span','meta');meta.innerHTML=`FOCUS <b class="am">${SEL}</b> · ${INST[SEL].name} · <b>${fmt(INST[SEL].px,2)}</b>`;sb.appendChild(meta);
}
function go(mod){
 mod=mod.toUpperCase();
 const alias={DELT:'GREEKS',DELTA:'GREEKS',GREEK:'GREEKS',TKT:'TNT',TICKET:'TNT',TRADE:'TNT',WEATHER:'WX',STORM:'WX',CHART:'CHRT',CHARTS:'CHRT',OPT:'OPTS',OPTIONS:'OPTS',VOL:'VOLS',SURFACE:'VOLS',SHIPS:'SHIP',TANKER:'SHIP',SUPPLY:'SPLC',SAT2:'SAT',MONITOR:'MON','?':'HELP',H:'HELP'};
 if(alias[mod])mod=alias[mod];
 if(!MODREG[mod]){flashCmd('UNKNOWN FUNCTION: '+mod);return;}
 curMod=mod;
 for(const d of document.querySelectorAll('.mod'))d.classList.remove('on');
 $('#mod-'+mod).classList.add('on');
 for(const b of $('#menu').children)b.classList.toggle('on',b.dataset.mod===mod);
 renderSub();
 const M=MODREG[mod];if(M.show)M.show();
}
function flashCmd(t){const i=$('#cmd');const o=i.placeholder;i.value='';i.placeholder=t;setTimeout(()=>i.placeholder=o,1400);}
function runCmd(){const v=$('#cmd').value.trim();if(!v)return;$('#cmd').value='';go(v);}
$('#goBtn').onclick=runCmd;
$('#cmd').addEventListener('keydown',e=>{if(e.key==='Enter')runCmd();});
window.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('#cmd')){e.preventDefault();$('#cmd').focus();}});

/* news ticker animation */
function buildTicker(){
 const parts=[];for(const s of ORDER){const I=INST[s];const c=(I.px/I.px0-1)*100;parts.push(`<b>${s}</b> ${fmt(I.px,2)} <span class="${c>=0?'u':'d'}">${sgn(c)}%</span>`);}
 $('#newsTrack').innerHTML=parts.join('  ·  ')+'  ·  ';
}
let tickerX=0;
function animTicker(){const tr=$('#newsTrack');tickerX-=0.6;if(-tickerX>tr.scrollWidth)tickerX=tr.parentElement.clientWidth;tr.style.transform=`translateX(${tickerX}px)`;requestAnimationFrame(animTicker);}
$('#newsTag').textContent='LIVE';

/* resize handling for canvas/plotly modules */
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{const M=MODREG[curMod];if(M&&M.show)M.show();},150);});

/* ===========================================================================
   LIVE backend wiring — when this page is served next to the gateway it streams
   real open data into the same modules; in the sandboxed artifact every call
   fails quietly and it stays a SIM.  Backbone: Binance+Deribit (/ws), LSE/FRED
   quotes, NOAA storms — all through the FastAPI gateway in /terminal/backend.
   =========================================================================== */
const LIVE=window.LIVE={on:false,api:'',ws:null,px:{},book:{},storms:null,opt:null,ships:{},satimg:null,_optAt:0,_stormAt:0,_satAt:0,keys:{}};
const BASE_OF={BTC:'BTCUSDT',ETH:'ETHUSDT',SOL:'SOLUSDT'};
const TERM_OF={BTCUSDT:'BTC',ETHUSDT:'ETH',SOLUSDT:'SOL','BTC-PERPETUAL':'BTC','ETH-PERPETUAL':'ETH'};
const CRYPTO_SYMS=['BTC','ETH','SOL'];
// terminal symbol -> LSE backend symbol (LSE forex uses underscores: EUR_USD …)
const LIVE_REST=[
  {s:'AAPL',q:'AAPL',tf:'1d'},{s:'NVDA',q:'NVDA',tf:'1d'},{s:'TSLA',q:'TSLA',tf:'1d'},{s:'XOM',q:'XOM',tf:'1d'},
  {s:'EURUSD',q:'EUR_USD',tf:'1d'},{s:'USDJPY',q:'USD_JPY',tf:'1d'},{s:'GBPUSD',q:'GBP_USD',tf:'1d'},{s:'AUDUSD',q:'AUD_USD',tf:'1d'},
];

async function liveGET(path){const r=await fetch(LIVE.api+path);if(!r.ok)throw new Error(r.status);return r.json();}

async function liveConnect(api){
  api=(api||'').replace(/\/$/,'');
  setLiveUI('connecting…');
  let hh;
  try{hh=await (await fetch(api+'/api/health')).json();}catch(e){LIVE.on=false;setLiveUI(false);return;}
  if(!hh||!hh.ok){LIVE.on=false;setLiveUI(false);return;}
  LIVE.api=api;LIVE.keys=hh.keys_present||{};LIVE.on=true;setLiveUI(true);   // connected; stays live
  try{await liveBootstrap();}catch(e){}
  try{liveOpenWS();}catch(e){}
  try{livePoll();}catch(e){}
  try{if(MODREG[curMod]&&MODREG[curMod].show)MODREG[curMod].show();}catch(e){}
}
function liveDisconnect(){LIVE.on=false;try{LIVE.ws&&LIVE.ws.close();}catch(e){}LIVE.ws=null;setLiveUI(false);}

async function liveBootstrap(){
  // real history into the candle store so CHRT shows live data immediately
  for(const s of CRYPTO_SYMS){try{
    const d=await liveGET(`/api/candles?symbol=${s}&timeframe=1h&limit=300`);
    if(d.candles&&d.candles.length){INST[s].cndl=d.candles;INST[s].px=d.candles.at(-1).close;INST[s].px0=d.candles[0].close;LIVE.px[s]=INST[s].px;}
  }catch(e){}}
  if(LIVE.keys.LSE_API_KEY)for(const r of LIVE_REST){if(!INST[r.s])continue;try{
    const d=await liveGET(`/api/candles?symbol=${r.q}&timeframe=${r.tf}&limit=250`);
    if(d.candles&&d.candles.length){INST[r.s].cndl=d.candles;INST[r.s].px=d.candles.at(-1).close;INST[r.s].px0=d.candles[0].close;LIVE.px[r.s]=INST[r.s].px;}
  }catch(e){}}
  await liveLoadStorms();
}
LIVE.loadStorms=()=>{if(Date.now()-LIVE._stormAt>60000)liveLoadStorms();};
async function liveLoadStorms(){try{LIVE._stormAt=Date.now();const d=await liveGET('/api/storms');LIVE.storms=d.storms||[];}catch(e){}}
LIVE.loadSat=()=>{if(!LIVE.satimg&&Date.now()-LIVE._satAt>120000)liveLoadSat();};
async function liveLoadSat(){try{LIVE._satAt=Date.now();const d=await liveGET('/api/satellite_image');
  if(d&&d.ok&&d.png_base64){const img=new Image();img.onload=()=>{LIVE.satimg=img;if(curMod==='SAT'&&MODREG.SAT.show)MODREG.SAT.show();};img.src='data:image/png;base64,'+d.png_base64;}}catch(e){}}

LIVE.loadOptions=()=>{const ccy=CRYPTO_SYMS.includes(SEL)?SEL:'BTC';if(Date.now()-LIVE._optAt>8000)liveLoadOptions(ccy);};
async function liveLoadOptions(sym){
  try{LIVE._optAt=Date.now();
    const [o,g]=await Promise.all([liveGET(`/api/options?underlying=${sym}`),liveGET(`/api/gex?underlying=${sym}`)]);
    LIVE.opt={ccy:sym,chain:o.chain||[],spot:g.spot,gexStrikes:g.strikes||[],gex:g.gex||[]};
    if((curMod==='OPTS'||curMod==='GEX')&&MODREG[curMod].show)MODREG[curMod].show();   // repaint with live data
  }catch(e){}
}
function liveOpenWS(){
  try{
    const url=LIVE.api.replace(/^http/,'ws')+'/ws';const ws=new WebSocket(url);LIVE.ws=ws;
    ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}
      if(m.type==='vessel'){if(m.mmsi){LIVE.ships[m.mmsi]={lat:m.lat,lon:m.lon,name:m.name,cog:m.cog,sog:m.sog,t:Date.now()};const ids=Object.keys(LIVE.ships);if(ids.length>700)delete LIVE.ships[ids[0]];}return;}
      const base=TERM_OF[m.sym];if(!base)return;
      if(m.type==='trade'||m.type==='ticker'){if(m.px)LIVE.px[base]=m.px;}
      else if(m.type==='kline'){LIVE.px[base]=m.c;const C=INST[base]&&INST[base].cndl;if(C){const last=C.at(-1);if(last&&last.time===m.t){last.high=m.h;last.low=m.l;last.close=m.c;last.vol=m.v;}else C.push({time:m.t,open:m.o,high:m.h,low:m.l,close:m.c,vol:m.v});}}
      else if(m.type==='book'){LIVE.book[base]={bids:m.bids,asks:m.asks};}
    };
    ws.onclose=()=>{if(LIVE.on)setTimeout(liveOpenWS,2500);};
  }catch(e){}
}
let _pollTimer=null;
function livePoll(){clearInterval(_pollTimer);_pollTimer=setInterval(async()=>{
  if(!LIVE.on)return;
  for(const r of LIVE_REST){if(!INST[r.s])continue;try{const q=await liveGET(`/api/quote?symbol=${r.q}`);if(q.last!=null)LIVE.px[r.s]=q.last;}catch(e){}}
},5000);}

function setLiveUI(state){
  const box=$('#simMode');if(!box)return;
  const dot=state===true?'#1fbf75':state==='connecting…'?'#f7a700':'#4b5668';
  const label=state===true?('LIVE · '+LIVE.api.replace(/^https?:\/\//,'')):(state==='connecting…'?'connecting…':'SIM · synthetic');
  box.innerHTML=`<span style="display:inline-flex;align-items:center;gap:6px">
    <span style="width:7px;height:7px;border-radius:50%;background:${dot};box-shadow:0 0 6px ${dot}"></span>
    <span>${label}</span>
    <input id="liveApi" value="${LIVE.api||location.origin}" style="width:150px;background:#05070b;border:1px solid #2a3545;color:#d6e0ee;font-family:var(--mono);font-size:10px;padding:2px 5px"/>
    <button id="liveBtn" style="background:${state===true?'#2a3545':'#1fbf75'};color:${state===true?'#d6e0ee':'#06080c'};border:0;padding:3px 8px;font-size:10px;font-weight:700;cursor:pointer">${state===true?'DISCONNECT':'GO LIVE'}</button></span>`;
  $('#liveBtn').onclick=()=>{if(LIVE.on)liveDisconnect();else liveConnect($('#liveApi').value.trim());};
}

/* ---------------- boot ---------------- */
buildMenu();buildRail();renderRail();updateHeader();buildTicker();go('WX');
setLiveUI(false);
// auto-attempt live when served by the gateway (harmless 404 → stays SIM in the artifact)
setTimeout(()=>liveConnect(location.origin),400);
setInterval(()=>{step();if(T%2===0)buildTicker();renderSub();},650);   // sim clock
requestAnimationFrame(animTicker);
// kick the storm along a bit so the scenario is visible on open
for(let i=0;i<10;i++)stepStorm();
</script>
