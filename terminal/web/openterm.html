<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPEN TERMINAL</title>
<link rel="preload" href="vendor/fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="vendor/fonts/jetbrains-mono-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/terminal.css">
<link rel="stylesheet" href="css/markets.css">
<link rel="stylesheet" href="css/flow.css">
<link rel="stylesheet" href="css/options.css">
<link rel="stylesheet" href="css/geo.css">
<link rel="stylesheet" href="css/sat.css">
<link rel="stylesheet" href="css/macro.css">
<!-- Shell markup only. All behaviour is in js/core.js (global OT); every module lives in js/mod/<id>.js.
     No inline script, no CDN: everything below is served by the gateway from this folder. -->
<script defer src="vendor/lightweight-charts.standalone.production.js"></script>
<script defer src="js/core.js"></script>
<script defer src="js/geomap.js"></script>
<script defer src="js/mod/mon.js"></script>
<script defer src="js/mod/chrt.js"></script>
<script defer src="js/mod/book.js"></script>
<script defer src="js/mod/heat.js"></script>
<script defer src="js/mod/foot.js"></script>
<script defer src="js/mod/opts.js"></script>
<script defer src="js/mod/vols.js"></script>
<script defer src="js/mod/greeks.js"></script>
<script defer src="js/mod/gex.js"></script>
<script defer src="js/mod/wx.js"></script>
<script defer src="js/mod/sat.js"></script>
<script defer src="js/mod/ship.js"></script>
<script defer src="js/mod/splc.js"></script>
<script defer src="js/mod/news.js"></script>
<script defer src="js/mod/eco.js"></script>
<script defer src="js/mod/tnt.js"></script>
<script defer src="js/mod/help.js"></script>
</head>
<body>
<header id="hdr">
  <div class="brand">OPEN<span>TERMINAL</span></div>
  <div class="hdr-inst" id="hdr-inst" aria-live="off">
    <div class="hi-id"><span class="hi-sym" id="hdr-id">&mdash;</span><span class="hi-name" id="hdr-name">no instrument selected</span></div>
    <div class="hi-last val" id="hdr-last">&mdash;</div>
    <div class="hi-chg"><span class="val" id="hdr-chg">&mdash;</span><span class="val" id="hdr-pct">&mdash;</span></div>
    <div class="hi-meta"><span id="hdr-badge"></span><span class="hi-age" id="hdr-age"></span></div>
  </div>
  <div class="lamps" id="lamps" role="group" aria-label="Data feeds"></div>
  <div class="clock" title="Real UTC time of this computer"><span class="clock-time" id="clock-time">--:--:--Z</span><span class="clock-date" id="clock-date">&nbsp;</span></div>
</header>

<div id="offline" role="alert" hidden>
  <b>GATEWAY OFFLINE</b>
  <span id="offline-msg"></span>
  <span class="off-detail" id="offline-detail"></span>
</div>

<aside id="rail" aria-label="Watchlist">
  <div class="cmd">
    <div class="cmd-row">
      <label class="cmd-prompt" for="cmd" aria-hidden="true">&gt;</label>
      <input id="cmd" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="48"
             placeholder="instrument and/or module" aria-label="Command line"
             title="Command line. Type an instrument, a module, or both (CL · CHRT · CL CHRT · gold · bitcoin book) and press Enter. Press / to focus, Esc to leave.">
    </div>
    <div class="cmd-hint" id="cmd-hint" aria-live="polite"></div>
  </div>
  <div class="watch" id="watch" role="listbox" aria-label="Instruments"></div>
</aside>

<nav id="tabs" aria-label="Modules"></nav>

<main id="main"></main>

<footer id="status">
  <span id="st-gw"></span>
  <span id="st-ws"></span>
  <span id="st-q"></span>
  <span id="st-warn" hidden></span>
  <span class="sp"></span>
  <span class="st-keys" id="st-keys"></span>
  <span id="st-ver"></span>
</footer>
</body>
</html>
